<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="robots" content="noindex, nofollow">
	<title>管理后台登录 - EdgeTunnel</title>
	<style>
		:root {
			--bg-grad-1: #0f172a;
			--bg-grad-2: #1e293b;
			--card-bg: rgba(30, 41, 59, 0.85);
			--accent: #f6821f;
			--accent-hover: #faab41;
			--text-main: #f8fafc;
			--text-sub: #94a3b8;
			--border: rgba(255, 255, 255, 0.1);
			--error: #ef4444;
		}
		* { margin: 0; padding: 0; box-sizing: border-box; }
		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%);
			color: var(--text-main);
			padding: 20px;
		}
		.login-card {
			background: var(--card-bg);
			border: 1px solid var(--border);
			backdrop-filter: blur(20px);
			-webkit-backdrop-filter: blur(20px);
			padding: 40px;
			border-radius: 20px;
			width: 100%;
			max-width: 400px;
			box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
			text-align: center;
			animation: fadeIn 0.5s ease;
		}
		@keyframes fadeIn {
			from { opacity: 0; transform: translateY(15px); }
			to { opacity: 1; transform: translateY(0); }
		}
		.logo-icon {
			width: 64px;
			height: 64px;
			margin: 0 auto 20px;
			background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
			border-radius: 16px;
			display: flex;
			align-items: center;
			justify-content: center;
			box-shadow: 0 10px 25px -5px rgba(246, 130, 31, 0.4);
		}
		.logo-icon svg { width: 34px; height: 34px; fill: white; }
		h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
		p.sub { font-size: 14px; color: var(--text-sub); margin-bottom: 28px; }
		.form-group { margin-bottom: 20px; text-align: left; }
		label { display: block; font-size: 13px; font-weight: 500; color: var(--text-sub); margin-bottom: 8px; }
		input[type="password"] {
			width: 100%;
			padding: 14px 16px;
			background: rgba(15, 23, 42, 0.6);
			border: 1px solid var(--border);
			border-radius: 12px;
			color: #fff;
			font-size: 16px;
			outline: none;
			transition: all 0.2s;
		}
		input[type="password"]:focus {
			border-color: var(--accent);
			box-shadow: 0 0 0 3px rgba(246, 130, 31, 0.2);
		}
		.btn-submit {
			width: 100%;
			padding: 14px;
			background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
			border: none;
			border-radius: 12px;
			color: #fff;
			font-size: 16px;
			font-weight: 600;
			cursor: pointer;
			transition: all 0.2s;
			box-shadow: 0 4px 12px rgba(246, 130, 31, 0.3);
		}
		.btn-submit:hover {
			transform: translateY(-1px);
			box-shadow: 0 6px 16px rgba(246, 130, 31, 0.4);
		}
		.btn-submit:active { transform: translateY(0); }
		.btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
		.error-msg {
			color: var(--error);
			font-size: 13px;
			margin-top: 12px;
			display: none;
		}
		.shake {
			animation: shake 0.4s ease-in-out;
		}
		@keyframes shake {
			0%, 100% { transform: translateX(0); }
			20%, 60% { transform: translateX(-6px); }
			40%, 80% { transform: translateX(6px); }
		}
	</style>
</head>
<body>
	<div class="login-card" id="card">
		<div class="logo-icon">
			<svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
		</div>
		<h1>管理后台登录</h1>
		<p class="sub">EdgeTunnel 本地管理面板</p>
		<form id="loginForm">
			<div class="form-group">
				<label for="password">管理员密码 (ADMIN / UUID / KEY)</label>
				<input type="password" id="password" name="password" placeholder="请输入管理员密码" required autofocus autocomplete="current-password">
			</div>
			<button type="submit" class="btn-submit" id="submitBtn">登录系统</button>
			<div class="error-msg" id="errorMsg">密码错误，请重试</div>
		</form>
	</div>
	<script>
		const form = document.getElementById('loginForm');
		const card = document.getElementById('card');
		const btn = document.getElementById('submitBtn');
		const err = document.getElementById('errorMsg');

		form.addEventListener('submit', async (e) => {
			e.preventDefault();
			const password = document.getElementById('password').value;
			btn.disabled = true;
			btn.textContent = '登录中...';
			err.style.display = 'none';

			try {
				const res = await fetch('/login', {
					method: 'POST',
					headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
					body: new URLSearchParams({ password }).toString()
				});
				const data = await res.json();
				if (data && data.success) {
					window.location.href = '/admin';
				} else {
					throw new Error('密码错误');
				}
			} catch (e) {
				card.classList.remove('shake');
				void card.offsetWidth;
				card.classList.add('shake');
				err.textContent = '密码错误或验证失败';
				err.style.display = 'block';
				btn.disabled = false;
				btn.textContent = '登录系统';
			}
		});
	</script>
</body>
</html>
